name: Update NBA predictions

# Runs the Basketball Predictor and commits data/predictions.json, which
# Predictor.app (basketball.html) reads. Times are UTC: roughly mid-morning,
# mid-afternoon and just before tip-off on the US east coast.
on:
  schedule:
    - cron: "17 15 * * *"
    - cron: "17 20 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:
  push:
    branches: [main, redesign/benos]
    paths:
      - "predictor/**"
      - ".github/workflows/predictions.yml"

permissions:
  contents: write

concurrency:
  group: predictions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: predictor/requirements.txt

      - name: Install dependencies
        run: pip install -r predictor/requirements.txt

      - name: Generate predictions
        run: python predictor/update_predictions.py

      - name: Commit if the predictions changed
        run: |
          if [ -z "$(git status --porcelain -- data/predictions.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          git commit -m "chore: update NBA predictions"
          git pull --rebase
          git push
